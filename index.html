<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Label Matrix</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js?v=4" defer></script>
</head>

<body>

    <header>
        <h1>Color Label Matrix</h1>
        <p class="subtitle">Personal Record Matrix</p>
    </header>

    <!-- 颜色选择区域 -->
    <section class="control-panel">

        <div class="section-title">颜色选择</div>

        <div id="palette"></div>

        <!-- 颜色标签设置 -->
        <div class="label-editor">
            <div id="currentColor"></div>

            <span id="currentColorName"></span>

            <input id="colorLabel" type="text" maxlength="12" placeholder="输入颜色标签">

            <button id="saveLabelBtn">设置标签</button>
        </div>

        <!-- 操作工具 -->
        <div class="toolbar">
            <button id="browseBtn">不填图</button>
            <button id="eraserBtn">橡皮擦</button>
            <button id="saveBtn">保存</button>
            <button id="exportBtn">导出备份</button>
            <button id="importBtn">导入备份</button>
            <button id="clearBtn" class="danger">清空</button>
        </div>

        <input type="file" id="importFile" accept=".json" hidden>

    </section>

    <!-- 状态信息 -->
    <div class="status-bar">
        <span id="gridInfo"></span>
        <span id="saveStatus">尚未修改</span>
    </div>

    <!-- 表格 -->
    <div class="table-container">
        <table id="matrix"></table>
    </div>

    <footer>
        单击或拖动填色 · 双击擦除 · 自动保存
    </footer>

</body>

</html>
